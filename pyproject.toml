[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoc"
version = "0.1.0"
description = "Keep .env.example honest: find the environment variables your code actually uses."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["dotenv", "environment-variables", "linter", "ci", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/envdoc"
Issues = "https://github.com/Viltrumlik/envdoc/issues"

[project.scripts]
envdoc = "envdoc:main"

[tool.setuptools]
py-modules = ["envdoc"]
